name: Deploy Token Chain website

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/token-chain-site-main.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Token Chain site branch
        uses: actions/checkout@v4
        with:
          ref: token-chain-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: token-chain-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
